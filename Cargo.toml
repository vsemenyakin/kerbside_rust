[package]
name = "kerbside"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A roadside speed-enforcement camera -- Rust port of the kerbside porting proxy"
license = "MIT"

[[bin]]
name = "kerbside"
path = "src/main.rs"

[[bin]]
name = "make_clip"
path = "src/bin/make_clip.rs"
required-features = ["overlay"]

[features]
# Name-based settings reflection: --dump-settings, name-keyed overrides, the
# apply()/VOLATILE runtime contract, and the derived Debug impls on the settings
# structs. On by default, so dev, release and the test suite behave as before.
#
# It is a feature at all because it is the sole source of the settings *field
# name* strings (IMAGE_POINTS, FRAME_WIDTH, ...) in the binary -- the schema a
# reverse engineer would otherwise get for free (T2 of docs/re_scoring.md). The
# shipped dist build turns it off (scripts/build.sh passes --no-default-features)
# so those strings never ship. See src/config/mod.rs for the split.
default = ["introspection", "overlay"]
introspection = []

# Overlay video and image codecs: `--overlay` mp4 output and make_clip's PNG
# export. A feature because videoio/imgcodecs pull in OpenCV's FFmpeg / GStreamer
# / codec backends, which cannot be linked statically without dragging ~30 more
# libraries. The dist build turns it off (scripts/build.sh --no-default-features)
# so the shipped binary links only core/imgproc/video -- and links them
# STATICALLY (see scripts/build.sh), putting the algorithm's cv:: calls
# (MOG2, the homography, morphology) beyond LD_PRELOAD interposition.
overlay = ["opencv/videoio", "opencv/imgcodecs"]

[dependencies]
# The same native libraries the Python calls. This is the point of the port:
# roughly three quarters of the frame is already inside these two, and that
# share costs exactly the same from Rust. Swapping either for a pure-Rust
# reimplementation would make the comparison meaningless.
opencv = { version = "0.100", default-features = false, features = ["imgproc", "video"] }
# `load-dynamic`: ONNX Runtime is opened at run time rather than linked in.
#
# Two reasons, and the second is the one that matters for the port evaluation.
# The immediate one is that the prebuilt static libraries are built against a
# newer MSVC STL than some VS 2022 installs ship, and linking them fails on an
# unresolved `__std_find_last_of_trivial_pos_1`. The lasting one is that a
# separately shipped `onnxruntime` is how the Raspberry Pi image is built too,
# so both targets load the same kind of artefact and the RE assessment does not
# have to caveat that one build inlined the runtime and the other did not.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-26"] }
# Note the absence of ort's "tracing" feature. Nothing here installs a tracing
# subscriber, so every event was being formatted into nothing -- and each one
# embeds its own `file!()` and line number as span metadata, which no compiler
# flag removes because they are ordinary data rather than panic locations. That
# was 26 of the source paths left in the binary. Dead weight and a leak at once.
ndarray = "0.17"

# The lock-free settings rebind. `apply()` in the Python is a module-global
# assignment that the GIL makes atomic for free; there is no such thing here,
# so it becomes an explicit atomic Arc swap. See src/config/mod.rs.
arc-swap = "1.7"

# The result CSV carries a SHA-256 of its own rows, and the clip tool hashes
# frames so a port's scene generator can be checked frame by frame. Pure Rust,
# no native dependency -- it has to build unchanged on aarch64.
sha2 = "0.10"
obfstr = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Keep symbols: this binary is the subject of a reverse-engineering assessment,
# and stripping is one of the variables under test rather than a default.
# See docs/re_scoring.md in the Python repository, and `profile.dist` below for
# the stripped arm of that comparison.
debug = false
panic = "unwind"

# What actually gets shipped.
#
#     cargo build --profile dist
#
# Nearly the same code generation as `release` -- same opt-level, same LTO --
# plus the symbol table removed and, via scripts/build.sh, panic = "abort" with
# a rebuilt std (see the profile below). The panic change means timings no
# longer carry over from `release` unchanged, so benchmark whatever you ship.
# Two separate things are worth keeping separate here:
#
#   * **Path remapping is not in this profile**, because it is not optional. It
#     is applied by the environment scripts to every build, including `release`
#     and the test binaries, since a build-machine path is a leak wherever it
#     appears. `tools/check_binary.py` is the check.
#   * **Stripping is in this profile only**, because it is one of the variables
#     the reverse-engineering assessment is supposed to *measure*. Build both
#     and record how long each takes to reverse; that difference is a result,
#     and defaulting it away would delete the measurement.
#
# Stripping matters much more on the Pi than on Windows: an ELF binary carries
# its symbol table in the file, whereas MSVC keeps names in a separate .pdb that
# is simply not shipped.
[profile.dist]
inherits = "release"
strip = "symbols"
# scripts/build.sh builds dist on nightly with -Zbuild-std and
# -Cpanic=immediate-abort, which rebuilds std without its panic machinery --
# that is what removes the residual /rustc/... source paths and the panic
# *message strings*, and it also drops the unwind tables. This panic = "abort"
# is the stable-safe base that flag overrides, and the fallback for a plain
# `cargo build --profile dist`. immediate-abort cannot live here: its manifest
# opt-in (cargo-features = ["panic-immediate-abort"]) breaks stable cargo and so
# every `cargo test --release`. Consequence either way: a panic in a worker
# thread aborts the process instead of unwinding into an error string --
# acceptable for a shipped device, and it is why dist's codegen (and timings)
# diverge from release.
panic = "abort"
